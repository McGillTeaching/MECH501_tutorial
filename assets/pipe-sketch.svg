<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img"
     aria-label="Pipe flow sketch: diameter D, length L, mean velocity U, pressure drop Delta p, fluid properties rho and mu"
     font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ed1b2f"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a919c"/>
    </marker>
  </defs>

  <!-- Pipe walls -->
  <line x1="70" y1="65" x2="490" y2="65" stroke="#8a919c" stroke-width="3"/>
  <line x1="70" y1="145" x2="490" y2="145" stroke="#8a919c" stroke-width="3"/>
  <!-- Centerline -->
  <line x1="60" y1="105" x2="500" y2="105" stroke="#8a919c" stroke-width="1" stroke-dasharray="7 5" opacity="0.6"/>

  <!-- Inflow arrows -->
  <line x1="18" y1="85"  x2="58" y2="85"  stroke="#ed1b2f" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="18" y1="105" x2="58" y2="105" stroke="#ed1b2f" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="18" y1="125" x2="58" y2="125" stroke="#ed1b2f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Mean velocity U -->
  <line x1="235" y1="105" x2="305" y2="105" stroke="#ed1b2f" stroke-width="3" marker-end="url(#arr)"/>
  <text x="262" y="95" fill="#ed1b2f" font-weight="600" font-style="italic">U</text>

  <!-- Fluid properties -->
  <text x="355" y="130" fill="#8a919c" font-style="italic">&#961;, &#956;</text>

  <!-- Diameter D -->
  <line x1="115" y1="70" x2="115" y2="140" stroke="#8a919c" stroke-width="2" marker-start="url(#arrg)" marker-end="url(#arrg)"/>
  <text x="124" y="110" fill="#8a919c" font-style="italic">D</text>

  <!-- Length L -->
  <line x1="70" y1="175" x2="490" y2="175" stroke="#8a919c" stroke-width="2" marker-start="url(#arrg)" marker-end="url(#arrg)"/>
  <text x="272" y="196" fill="#8a919c" font-style="italic">L</text>

  <!-- Pressure taps -->
  <line x1="150" y1="65" x2="150" y2="45" stroke="#8a919c" stroke-width="2"/>
  <line x1="430" y1="65" x2="430" y2="45" stroke="#8a919c" stroke-width="2"/>
  <text x="141" y="36" fill="#8a919c" font-style="italic">p&#8321;</text>
  <text x="422" y="36" fill="#8a919c" font-style="italic">p&#8322;</text>
  <text x="222" y="30" fill="#ed1b2f" font-weight="600">&#916;p = p&#8321; &#8722; p&#8322;</text>
</svg>
