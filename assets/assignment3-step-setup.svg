<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Precursor and backward-facing step</title>
<desc id="desc">A separate periodic channel supplies developed mean profiles to a step inlet of height h. The lower wall drops by h at x equals zero, doubling the channel height. A separated shear layer encloses a recirculation region and reattaches downstream.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326b94"/></marker></defs>
<rect width="1000" height="390" rx="10" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="17" fill="#202b35">
<text x="30" y="32" font-weight="bold">Instructor: channel precursor</text>
<path d="M35 110H275 M35 205H275" stroke="#202b35" stroke-width="4"/>
<path d="M60 155H250" stroke="#326b94" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="65" y="140">Driving force</text>
<path d="M260 210V240H50V210" fill="none" stroke="#326b94" stroke-width="2" marker-end="url(#arrow)"/>
<text x="70" y="266">Periodic channel</text>
<text x="45" y="294">Developed mean profiles</text>
<path d="M290 157H380" stroke="#326b94" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="302" y="132">Supply</text>
<text x="400" y="32" font-weight="bold">Students: backward-facing-step cases</text>
<path d="M400 110H945 M400 205H540V300H945" stroke="#202b35" stroke-width="4" fill="none"/>
<path d="M400 111V204 M945 111V299" stroke="#8b98a3" stroke-dasharray="4 4"/>
<path d="M410 120Q470 157 410 195" stroke="#326b94" stroke-width="2" fill="none"/>
<path d="M414 157H480 M875 158H965" stroke="#326b94" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="86">Inlet: H = h</text><text x="879" y="86">Outlet</text>
<path d="M541 205Q690 208 785 298" fill="none" stroke="#326b94" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="590" y="184">Separated shear layer</text>
<path d="M610 257C610 230 697 232 705 261C710 290 620 289 613 266" fill="none" stroke="#326b94" stroke-width="2" marker-end="url(#arrow)"/>
<text x="573" y="327">Recirculation</text>
<circle cx="785" cy="299" r="5" fill="#ed1b2f"/>
<text x="748" y="350">Reattachment: x = xᵣ</text>
<text x="458" y="259">Step h</text>
<text x="490" y="351">x = 0</text>
<text x="830" y="283">y = −h</text>
<text x="714" y="64">Upper wall: y = h</text>
<text x="398" y="232">y = 0</text>
<text x="30" y="369" font-size="15">Common inlet source for all models; inlet samples match each mesh. Schematic, not to scale.</text>
</g></svg>